[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "et-harness"
dynamic = ["version"]
description = "Embedded Targets Agentic AI Harness kernel and multi-agent orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
harness = "et_harness.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "et_harness.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
